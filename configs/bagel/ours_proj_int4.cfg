[general]
run_name = scale_example_run_32x64_os

; ARGUS optional projection-quantization slot (framework §15, quant_proj=True).
; qkv/omap weights quantized to INT4 so BOTH 32x32 sub-arrays compute the
; projection -> the merged 32x64 array (vs the FP-FP-only 32x32 half array
; when projections stay fp16). W4A16: INT4 weights, fp16 activations.
;   - ArrayWidth 64 = the merged dual array (halves projection col-folds);
;   - FilterSramSzkB 256 = the physical 128KB weight buffer counted in 0.5B
;     int4 elements (128KB / 0.5B = 256);
;   - FilterSRAMBankBandwidth 32 = int4 4x element bandwidth (32 elem x 0.5B
;     = 16 byte/cycle physical, matching fp16's 8 elem x 2B). ifmap/ofmap
;     (activations) stay at 8 (fp16). See single_layer_sim.py:267-270.
; Energy is billed per operand at the call site: MACs w4a16, weights 0.5B.

[architecture_presets]
ArrayHeight:    32
ArrayWidth:     64
IfmapSramSzkB:   64
FilterSramSzkB:  256
OfmapSramSzkB:   64
IfmapOffset:    0
FilterOffset:   10000000
OfmapOffset:    20000000
Bandwidth : 8
Dataflow : os
MemoryBanks:   1
ReadRequestBuffer: 32
WriteRequestBuffer: 32

[layout]
IfmapCustomLayout: False
IfmapSRAMBankBandwidth: 8
IfmapSRAMBankNum: 8
IfmapSRAMBankPort: 2
FilterCustomLayout: False
FilterSRAMBankBandwidth: 32
FilterSRAMBankNum: 8
FilterSRAMBankPort: 2

[sparsity]
SparsitySupport : false
SparseRep : ellpack_block
OptimizedMapping : false
BlockSize : 8
RandomNumberGeneratorSeed : 40

[run_presets]
InterfaceBandwidth: USER
UseRamulatorTrace: False
