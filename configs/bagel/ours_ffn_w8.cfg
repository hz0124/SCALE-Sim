[general]
run_name = scale_example_run_32x32_os

; ARGUS text-stage FFN slot. There is NO FP-INT8 compute unit: compute runs
; on the 32x32 FP-FP array (the FP-INT4 array idles). FFN weights are merely
; STORED as INT8 and CRU-dequantized to BF16 on the fly, so:
;   - FilterSramSzkB 64 = the physical 64KB weight buffer counted in 1B
;     int8 elements (fp16 cfgs count the same 64KB as "32");
;   - FilterSRAMBankBandwidth 16 = the x2 effective weight bandwidth (int8
;     packs 2 elements per byte; physical 16 byte/cycle matches fp16's
;     8 elem x 2B). In USER mode SCALE-Sim reads the filter / ifmap / ofmap
;     DRAM bandwidths INDEPENDENTLY from FilterSRAMBankBandwidth /
;     IfmapSRAMBankBandwidth / Bandwidth (single_layer_sim.py:267-270), so
;     only the weight operand is sped up; ifmap (activations) and ofmap stay
;     at 8 (fp16). The top-level `Bandwidth` only drives ofmap.
; Energy is billed per operand at the call site: MACs fp16, weights 1B.

[architecture_presets]
ArrayHeight:    32
ArrayWidth:     32
IfmapSramSzkB:   64
FilterSramSzkB:  128
OfmapSramSzkB:   64
IfmapOffset:    0
FilterOffset:   10000000
OfmapOffset:    20000000
Bandwidth : 8
Dataflow : os
MemoryBanks:   1
ReadRequestBuffer: 32
WriteRequestBuffer: 32

[layout]
IfmapCustomLayout: False
IfmapSRAMBankBandwidth: 8
IfmapSRAMBankNum: 8
IfmapSRAMBankPort: 2
FilterCustomLayout: False
FilterSRAMBankBandwidth: 16
FilterSRAMBankNum: 8
FilterSRAMBankPort: 2

[sparsity]
SparsitySupport : false
SparseRep : ellpack_block
OptimizedMapping : false
BlockSize : 8
RandomNumberGeneratorSeed : 40

[run_presets]
InterfaceBandwidth: USER
UseRamulatorTrace: False
